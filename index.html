<div id="vocab-app">
<style>
#vocab-app{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:0 auto;padding:28px 22px;color:#17202a}
#vocab-app *{box-sizing:border-box}
.v-head{margin-bottom:22px}.v-head h1{font-size:clamp(25px,4vw,38px);margin:0 0 7px;font-weight:800;letter-spacing:-.5px}.v-head p{margin:0;color:#5c6770;font-size:15px;line-height:1.5}.answer-key{margin-top:22px;text-align:left;border-top:1px solid #e1e5e7;padding-top:18px}.answer-key h3{margin:0 0 12px;font-size:18px}.answer-key-item{padding:9px 0;border-bottom:1px solid #edf0f1;font-size:14px;line-height:1.45}.answer-key-item strong{color:#24584e}
.progress-wrap{margin:20px 0 26px}.progress-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-bottom:8px}.progress{height:9px;background:#e9edf0;border-radius:20px;overflow:hidden}.progress-bar{height:100%;width:0;background:#2f6f62;transition:width .3s ease}
.card{border:1px solid #dfe5e8;border-radius:18px;padding:24px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.word-tag{display:inline-block;background:#eef5f3;color:#24584e;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:800;margin-bottom:14px}.question{font-size:21px;line-height:1.45;font-weight:750;margin:0 0 20px}.context{background:#f6f8f9;border-left:4px solid #9aa8ad;padding:13px 15px;border-radius:8px;margin-bottom:19px;font-size:15px;line-height:1.55;color:#39444b}.options{display:grid;gap:11px}.option{width:100%;text-align:left;padding:14px 16px;border:2px solid #d9e0e3;background:#fff;border-radius:12px;font-size:15px;line-height:1.4;cursor:pointer;transition:.15s}.option:hover:not(:disabled){border-color:#5b8f84;background:#f7fbfa}.option:disabled{cursor:default}.option.correct{border-color:#2f7d5c;background:#edf8f2}.option.wrong{border-color:#b44b4b;background:#fff0f0}.feedback{margin-top:17px;padding:14px 16px;border-radius:11px;line-height:1.5;font-size:15px;display:none}.feedback.show{display:block}.feedback.good{background:#edf8f2;color:#205b42}.feedback.bad{background:#fff0f0;color:#7b2f2f}.next{margin-top:18px;border:0;background:#2f6f62;color:#fff;padding:13px 21px;border-radius:11px;font-weight:800;font-size:15px;cursor:pointer;display:none}.next.show{display:inline-block}.next:hover{filter:brightness(.94)}
.result{display:none;text-align:center}.result.show{display:block}.score-ring{width:130px;height:130px;border-radius:50%;border:10px solid #dce9e5;display:flex;align-items:center;justify-content:center;margin:8px auto 20px;font-size:30px;font-weight:850;color:#24584e}.result h2{font-size:28px;margin:0 0 8px}.result p{color:#5c6770;margin:0 0 20px}.review{margin-top:22px;text-align:left;border-top:1px solid #e1e5e7;padding-top:18px}.review h3{margin:0 0 12px;font-size:18px}.review-item{padding:10px 0;border-bottom:1px solid #edf0f1;font-size:14px}.review-item strong{color:#7b2f2f}.restart{margin-top:20px;border:2px solid #2f6f62;background:#fff;color:#24584e;padding:12px 20px;border-radius:11px;font-weight:800;cursor:pointer}
@media(max-width:520px){#vocab-app{padding:20px 14px}.card{padding:18px}.question{font-size:18px}}
</style>
<div class="v-head"><h1>🌱 Sustainable Fashion</h1><p>Vocabulary Practice • 15 questions • Choose the best answer.</p></div>
<div style="background:#f6f8f9;border-left:4px solid #2f6f62;padding:12px 15px;border-radius:8px;margin-bottom:18px;font-size:14px;line-height:1.5"><strong>Standalone webpage:</strong> Save this HTML file to your computer and open it with Chrome or Edge. It runs independently and does not require ChatGPT.</div>
<div class="progress-wrap"><div class="progress-top"><span id="counter">Question 1 of 15</span><span id="score-label">Score: 0</span></div><div class="progress"><div class="progress-bar" id="bar"></div></div></div>
<div class="card" id="quiz-card"><div id="quiz"></div><div id="feedback" class="feedback"></div><button id="next" class="next" type="button">Next question →</button></div>
<div class="card result" id="result"><div class="score-ring" id="final-score">0/15</div><h2 id="result-title">Finished!</h2><p id="result-text"></p><div class="review" id="review"></div><button class="restart" id="restart" type="button">Try Again</button></div>
<script>
(function(){
const questions=[
{word:'transformation',q:'In “the fashion industry has undergone a significant transformation”, what does transformation mean?',o:['a temporary delay','a financial loss','a major change','a strict regulation'],a:2,e:'Transformation means a significant change or development.'},
{word:'discerning',q:'Consumers are becoming more discerning about their clothing choices. What does discerning mean?',o:['careless and impulsive','uninterested in quality','easily influenced by advertisements','able to judge carefully and make thoughtful choices'],a:3,e:'A discerning person notices differences and makes careful judgments.'},
{word:'detrimental',q:'Fast fashion has “detrimental effects on the environment”. What does detrimental mean?',o:['unexpected but useful','harmful or damaging','cheap and convenient','temporary'],a:1,e:'Detrimental means causing harm or damage.'},
{word:'ethical',q:'Sustainable fashion advocates for an “ethical approach”. Which meaning is closest?',o:['focused only on making money','designed to follow the latest trend','based on moral principles and fairness','difficult to understand'],a:2,e:'Ethical describes behaviour that follows accepted moral principles, especially fairness and responsibility.'},
{word:'environmental stewardship',q:'Brands should prioritize “environmental stewardship”. What does this phrase suggest?',o:['using more natural resources','avoiding all modern technology','selling products at lower prices','taking responsible care of the environment'],a:3,e:'Environmental stewardship means responsibly protecting and managing the natural environment.'},
{word:'ecological footprint',q:'What is a brand’s “ecological footprint”?',o:['the number of workers it employs','the popularity of its products','the environmental impact caused by its activities','the physical size of its factories'],a:2,e:'An ecological footprint refers to the impact human activities have on the environment and its resources.'},
{word:'circular fashion',q:'What does “circular fashion” involve?',o:['selling only expensive designer clothes','designing products that can be reused or recycled','changing fashion trends every season','producing clothes as quickly as possible'],a:1,e:'Circular fashion aims to keep materials and products in use through reuse, repair and recycling.'},
{word:'lifecycle',q:'A sustainable approach “extends the lifecycle of garments”. What does lifecycle mean here?',o:['the amount of money a product earns','the time needed to design a logo','the number of colours available','the period from a product’s creation through its use and eventual disposal'],a:3,e:'A product’s lifecycle covers its stages from creation and use to the end of its useful life.'},
{word:'elitist',q:'Sustainable clothing is sometimes perceived as “elitist”. What does elitist mean?',o:['environmentally harmful','extremely fashionable','designed or associated mainly with a privileged group','available and affordable to everyone'],a:2,e:'Elitist suggests something is associated with or accessible mainly to a privileged group.'},
{word:'disparity',q:'The “price disparity” between sustainable and fast fashion raises questions about accessibility. What is a disparity?',o:['a shared agreement','a repeated mistake','a noticeable difference or inequality','a sudden improvement'],a:2,e:'A disparity is a significant difference or inequality between two things.'},
{word:'equity',q:'The article raises questions about “accessibility and equity”. What does equity mean?',o:['personal preference','economic growth','fashionable appearance','fairness and equal opportunity'],a:3,e:'Equity refers to fairness and the idea that people should have fair access and opportunities.'},
{word:'counterparts',q:'Sustainable products are often more expensive than their fast-fashion “counterparts”. What are counterparts?',o:['older versions of a product','completely unrelated products','things that have a similar role or function','competitors in another industry'],a:2,e:'Counterparts are people or things that correspond to or have a similar role to others.'},
{word:'proponents',q:'“Proponents of sustainable fashion” argue that quality is better than quantity. Who are proponents?',o:['people who manufacture clothes','people who support an idea','people who buy products secretly','people who strongly oppose an idea'],a:1,e:'Proponents are people who support, defend or argue in favour of an idea.'},
{word:'utilizing',q:'Brands are “utilizing platforms like Instagram and TikTok”. What does utilizing mean?',o:['criticising publicly','replacing something with another product','using something for a particular purpose','avoiding completely'],a:2,e:'Utilize means to use something, especially effectively or for a specific purpose.'},
{word:'advocacy',q:'“With continued advocacy, innovation, and consumer demand…” What does advocacy mean?',o:['a disagreement between companies','a type of fabric','public support for a cause or idea','a reduction in production'],a:2,e:'Advocacy means publicly supporting or promoting a particular cause, policy or idea.'}
,{word:'oriented towards',q:'The industry is “increasingly oriented towards sustainability”. What does oriented towards mean?',o:['moving or focusing in the direction of something','strongly opposed to something','unaware of something','separated from something'],a:0,e:'Oriented towards means directed or focused on a particular aim or goal.'}
,{word:'awareness',q:'“As awareness of environmental issues grows…” What does awareness mean?',o:['knowledge or understanding of something','fear of something','a disagreement about something','a financial investment'],a:0,e:'Awareness means knowledge or understanding of a situation, issue or fact.'}
,{word:'mounting criticism',q:'Fast fashion has faced “mounting criticism”. What does mounting criticism mean?',o:['criticism that is gradually increasing','criticism that has completely stopped','criticism from only one person','criticism about clothing sizes'],a:0,e:'Mounting means increasing or becoming greater over time.'}
,{word:'narrative',q:'“The narrative surrounding fashion has shifted.” What does narrative mean here?',o:['the story or way an issue is commonly described','the price of a product','a type of fabric','a manufacturing machine'],a:0,e:'Narrative refers to the particular story, interpretation or way something is presented.'}
,{word:'prompting',q:'The change is “prompting both brands and consumers to reconsider their practices”. What does prompting mean?',o:['causing or encouraging someone to act','preventing someone from acting','confusing someone deliberately','rewarding someone financially'],a:0,e:'Prompting means causing or encouraging someone to do something.'}
,{word:'opt for',q:'Many designers are “opting for organic materials”. What does opt for mean?',o:['choose or decide to use something','avoid something completely','produce something cheaply','criticise something publicly'],a:0,e:'To opt for something means to choose it from several possibilities.'}
,{word:'sourcing',q:'“By sourcing fabrics like organic cotton or hemp…” What does sourcing mean?',o:['obtaining or finding something from a particular place','designing something from scratch','throwing something away','advertising something online'],a:0,e:'Sourcing means obtaining materials, products or resources from a particular source.'}
,{word:'lessen',q:'Brands can “significantly lessen their ecological footprint”. What does lessen mean?',o:['reduce or make something smaller','measure something accurately','increase something rapidly','replace something completely'],a:0,e:'Lessen means to reduce the amount, degree or effect of something.'}
,{word:'emphasis',q:'There is “a growing emphasis on the concept of circular fashion”. What does emphasis mean?',o:['special importance or attention given to something','a complete rejection of something','a financial reward','a manufacturing process'],a:0,e:'Emphasis means special importance, attention or stress placed on something.'}
,{word:'minimizes',q:'Circular fashion “minimizes waste”. What does minimizes mean?',o:['reduces something to the smallest practical amount','creates something from waste','measures something carefully','hides something from consumers'],a:0,e:'Minimize means to reduce something as much as possible.'}
,{word:'pressing issue',q:'Waste is described as “one of the most pressing issues”. What does pressing mean?',o:['very urgent and requiring attention','unimportant and easily ignored','expensive but fashionable','difficult to measure'],a:0,e:'A pressing issue is one that is urgent and needs attention soon.'}
,{word:'developments',q:'“Despite these positive developments, challenges remain.” What are developments?',o:['changes or progress that have taken place','arguments between companies','new clothing materials only','financial losses'],a:0,e:'Developments are changes, progress or new situations that occur over time.'}
,{word:'perceived',q:'Sustainable clothing is “often perceived as elitist”. What does perceived mean?',o:['seen or understood in a particular way','produced in a factory','sold at a discount','recycled into another product'],a:0,e:'Perceived means regarded, understood or seen in a particular way.'}
,{word:'counterparts',q:'Fast-fashion garments are described as sustainable products’ “counterparts”. What does counterparts mean?',o:['things with a corresponding role or purpose','things with no connection at all','older products that are no longer sold','materials used to make clothing'],a:0,e:'Counterparts are things that correspond to or have a similar role or function.'}
,{word:'disparity',q:'The price “disparity” raises questions about accessibility. What does disparity mean?',o:['a significant difference or inequality','a close similarity','a sudden improvement','a shared responsibility'],a:0,e:'Disparity means a noticeable difference, especially an unfair or unequal one.'}
,{word:'accessibility',q:'What does “accessibility” mean in the discussion of sustainable fashion?',o:['how easily something can be obtained or used by people','how fashionable something looks','how quickly something is manufactured','how long a garment lasts'],a:0,e:'Accessibility refers to how easily people can obtain, use or benefit from something.'}
,{word:'at a crossroads',q:'Consumers find themselves “at a crossroads”. What does this expression mean?',o:['having to choose between important alternatives','being physically lost on a road','having no choices at all','having already made a decision'],a:0,e:'Being at a crossroads means facing an important choice between different directions or options.'}
,{word:'invest',q:'Consumers may “invest in higher-priced sustainable options”. What does invest mean here?',o:['spend money with the expectation of gaining a benefit','borrow money without a purpose','refuse to buy something','sell something at a loss'],a:0,e:'Here, invest means spending money on something because it is expected to provide value or benefit over time.'}
,{word:'ultimately',q:'Investing in quality “ultimately benefits consumers”. What does ultimately mean?',o:['in the end or eventually','immediately','occasionally','at the same time'],a:0,e:'Ultimately means finally, or in the end.'}
,{word:'frequent',q:'A sustainable wardrobe can reduce the need for “frequent replacements”. What does frequent mean?',o:['happening often','happening rarely','happening unexpectedly','happening only once'],a:0,e:'Frequent means happening often or repeatedly.'}
,{word:'crucial',q:'“Social media plays a crucial role.” What does crucial mean?',o:['extremely important or necessary','slightly useful','unrelated to the situation','difficult to access'],a:0,e:'Crucial means extremely important or essential to a situation.'}
,{word:'utilizing',q:'Influencers are “utilizing platforms like Instagram and TikTok”. What does utilizing mean?',o:['using something for a particular purpose','avoiding something completely','criticising something publicly','replacing something with another product'],a:0,e:'Utilize means to use something, especially effectively or for a specific purpose.'}
,{word:'engage with',q:'Consumers can “engage with sustainability in a more interactive way”. What does engage with mean?',o:['become actively involved with something','avoid discussing something','pay for something immediately','copy something without thinking'],a:0,e:'To engage with something means to become actively involved with, interact with or think about it.'}
,{word:'preferences',q:'“As more consumers shift their preferences…” What are preferences?',o:['things that people like or choose over alternatives','rules imposed by governments','products that are difficult to sell','environmental regulations'],a:0,e:'Preferences are the things someone likes, prefers or chooses over other possibilities.'}
,{word:'commit to',q:'An increasing number of brands are “committing to sustainable practices”. What does commit to mean?',o:['promise or decide firmly to support or do something','avoid something temporarily','criticise something publicly','change something without planning'],a:0,e:'To commit to something means to promise or firmly decide to support or do it.'}
,{word:'cultural shift',q:'The trend represents “a cultural shift”. What does cultural shift mean?',o:['a significant change in the attitudes, values or behaviour of a society','a change in clothing sizes','a temporary fashion trend','a disagreement between cultures'],a:0,e:'A cultural shift is a significant change in the beliefs, attitudes, values or behaviour of a society.'}
,{word:'fraught with',q:'The journey is “fraught with obstacles”. What does fraught with mean?',o:['full of something difficult or unpleasant','completely free from problems','carefully planned in advance','based mainly on technology'],a:0,e:'Fraught with means filled or surrounded with difficulties, problems or dangers.'}
,{word:'collective effort',q:'“The collective effort of consumers, designers, and brands…” What does collective effort mean?',o:['an effort made by several people or groups together','an effort made by one person alone','an effort that is unsuccessful','an effort made secretly'],a:0,e:'Collective means shared by or involving several people or groups working together.'}
,{word:'the norm',q:'The hope is that sustainable fashion will “become the norm rather than the exception”. What does the norm mean?',o:['the usual or accepted standard or practice','a rare and unusual situation','a serious environmental problem','a temporary experiment'],a:0,e:'The norm is what is usual, expected or generally accepted.'}
,{word:'innovation',q:'“With continued advocacy, innovation, and consumer demand…” What does innovation mean?',o:['a new idea, method or technology that improves something','a refusal to change anything','a type of recycled fabric','a disagreement about prices'],a:0,e:'Innovation means a new idea, method or technology introduced to improve something.'}
];
const qs=[
{word:'transformation',q:'In “the fashion industry has undergone a significant transformation”, what does transformation mean?',o:['a temporary delay','a financial loss','a major change','a strict regulation'],a:2},
{word:'discerning',q:'Consumers are becoming more discerning about their clothing choices. What does discerning mean?',o:['careless and impulsive','uninterested in quality','easily influenced by advertisements','able to judge carefully and make thoughtful choices'],a:3},
{word:'detrimental',q:'Fast fashion has “detrimental effects on the environment”. What does detrimental mean?',o:['unexpected but useful','harmful or damaging','cheap and convenient','temporary'],a:1},
{word:'ethical',q:'Sustainable fashion advocates for an “ethical approach”. Which meaning is closest?',o:['focused only on making money','designed to follow the latest trend','based on moral principles and fairness','difficult to understand'],a:2},
{word:'environmental stewardship',q:'Brands should prioritize “environmental stewardship”. What does this phrase suggest?',o:['using more natural resources','avoiding all modern technology','selling products at lower prices','taking responsible care of the environment'],a:3},
{word:'ecological footprint',q:'What is a brand’s “ecological footprint”?',o:['the number of workers it employs','the popularity of its products','the environmental impact caused by its activities','the physical size of its factories'],a:2},
{word:'circular fashion',q:'What does “circular fashion” involve?',o:['selling only expensive designer clothes','designing products that can be reused or recycled','changing fashion trends every season','producing clothes as quickly as possible'],a:1},
{word:'lifecycle',q:'A sustainable approach “extends the lifecycle of garments”. What does lifecycle mean here?',o:['the amount of money a product earns','the time needed to design a logo','the number of colours available','the period from a product’s creation through its use and eventual disposal'],a:3},
{word:'elitist',q:'Sustainable clothing is sometimes perceived as “elitist”. What does elitist mean?',o:['environmentally harmful','extremely fashionable','designed or associated mainly with a privileged group','available and affordable to everyone'],a:2},
{word:'disparity',q:'The “price disparity” between sustainable and fast fashion raises questions about accessibility. What is a disparity?',o:['a shared agreement','a repeated mistake','a noticeable difference or inequality','a sudden improvement'],a:2},
{word:'equity',q:'The article raises questions about “accessibility and equity”. What does equity mean?',o:['personal preference','economic growth','fashionable appearance','fairness and equal opportunity'],a:3},
{word:'counterparts',q:'Sustainable products are often more expensive than their fast-fashion “counterparts”. What are counterparts?',o:['older versions of a product','completely unrelated products','things that have a similar role or function','competitors in another industry'],a:2},
{word:'proponents',q:'“Proponents of sustainable fashion” argue that quality is better than quantity. Who are proponents?',o:['people who manufacture clothes','people who support an idea','people who buy products secretly','people who strongly oppose an idea'],a:1},
{word:'utilizing',q:'Brands are “utilizing platforms like Instagram and TikTok”. What does utilizing mean?',o:['criticising publicly','replacing something with another product','using something for a particular purpose','avoiding completely'],a:2},
{word:'advocacy',q:'“With continued advocacy, innovation, and consumer demand…” What does advocacy mean?',o:['a disagreement between companies','a type of fabric','public support for a cause or idea','a reduction in production'],a:2}
];
let i=0,score=0,answered=false;
const quiz=document.getElementById('quiz'),feedback=document.getElementById('feedback'),next=document.getElementById('next');
function render(){answered=false;const x=qs[i];document.getElementById('counter').textContent=`Question ${i+1} of 15`;document.getElementById('score-label').textContent=`Score: ${score}`;document.getElementById('bar').style.width=((i)/15*100)+'%';feedback.className='feedback';feedback.textContent='';next.className='next';quiz.innerHTML=`<div class="word-tag">Vocabulary: ${x.word}</div><p class="question">${x.q}</p><div class="options">${x.o.map((v,k)=>`<button class="option" type="button" data-n="${k}">${String.fromCharCode(65+k)}. ${v}</button>`).join('')}</div>`;quiz.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.n))))}
function choose(n){if(answered)return;answered=true;const x=qs[i],buttons=quiz.querySelectorAll('.option');buttons.forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('correct');if(k===n&&n!==x.a)b.classList.add('wrong')});if(n===x.a){score++;feedback.className='feedback show good';feedback.innerHTML='<strong>✓ Correct!</strong>'}else{feedback.className='feedback show bad';feedback.innerHTML=`<strong>✗ Not quite.</strong> The correct answer is <strong>${String.fromCharCode(65+x.a)}. ${x.o[x.a]}</strong>.`};document.getElementById('score-label').textContent=`Score: ${score}`;document.getElementById('bar').style.width=((i+1)/15*100)+'%';next.textContent=i===14?'See results →':'Next question →';next.className='next show'}
next.addEventListener('click',()=>{if(!answered)return;if(i<14){i++;render()}else{document.getElementById('quiz-card').style.display='none';document.querySelector('.progress-wrap').style.display='none';showResult()}});
function showResult(){const r=document.getElementById('result');r.className='card result show';document.getElementById('final-score').textContent=`${score}/15`;document.getElementById('result-title').textContent=score>=13?'Excellent!':score>=10?'Very good!':'Keep practising!';document.getElementById('result-text').textContent=`You scored ${score} out of 15.`;document.getElementById('review').innerHTML='<div class="answer-key"><h3>Answer Key</h3>'+qs.map((x,n)=>`<div class="answer-key-item"><strong>${n+1}. ${x.word}</strong> — ${String.fromCharCode(65+x.a)}. ${x.o[x.a]}</div>`).join('')+'</div>'}
document.getElementById('restart').addEventListener('click',()=>{i=0;score=0;document.getElementById('result').className='card result';document.getElementById('quiz-card').style.display='block';document.querySelector('.progress-wrap').style.display='block';render()});render();
})();
</script>
</div>
