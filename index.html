<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Toxicity — Vocabulary Practice</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8f9;margin:0;color:#17202a}
#app{max-width:900px;margin:auto;padding:28px 22px}
h1{font-size:clamp(25px,4vw,38px);margin:0 0 7px;font-weight:800}
.sub{color:#5c6770;font-size:15px}
.progress{margin:22px 0}.top{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:8px}
.track{height:9px;background:#e1e7e9;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#2f6f62;transition:.3s}
.card{background:white;border:1px solid #dfe5e8;border-radius:18px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.tag{display:inline-block;background:#eef5f3;color:#24584e;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:800;margin-bottom:14px}
.q{font-size:21px;line-height:1.45;font-weight:750;margin:0 0 20px}
.options{display:grid;gap:11px}.option{width:100%;text-align:left;padding:14px 16px;border:2px solid #d9e0e3;background:white;border-radius:12px;font-size:15px;line-height:1.4;cursor:pointer}
.option.correct{border-color:#2f7d5c;background:#edf8f2}.option.wrong{border-color:#b44b4b;background:#fff0f0}
.feedback{margin-top:17px;padding:14px 16px;border-radius:11px;line-height:1.5;font-size:15px;display:none}.show{display:block}
.good{background:#edf8f2;color:#205b42}.bad{background:#fff0f0;color:#7b2f2f}
button.next,.restart{margin-top:18px;padding:13px 21px;border-radius:11px;font-weight:800;font-size:15px;cursor:pointer}
.next{border:0;background:#2f6f62;color:white;display:none}.restart{border:2px solid #2f6f62;background:white;color:#24584e}
.result{text-align:center;display:none}.ring{width:130px;height:130px;border-radius:50%;border:10px solid #dce9e5;display:flex;align-items:center;justify-content:center;margin:8px auto 20px;font-size:30px;font-weight:850;color:#24584e}
.review{text-align:left;margin-top:22px;border-top:1px solid #e1e5e7;padding-top:18px}.review div{padding:9px 0;border-bottom:1px solid #edf0f1;font-size:14px}
@media(max-width:520px){#app{padding:20px 14px}.card{padding:18px}.q{font-size:18px}}
</style>
</head>
<body>
<div id="app">
<h1>💬 Online Toxicity</h1>
<p class="sub">Vocabulary Practice • 15 questions • Choose the best answer.</p>
<div class="progress"><div class="top"><span id="counter">Question 1 of 15</span><span id="score">Score: 0</span></div><div class="track"><div class="bar" id="bar"></div></div></div>
<div class="card" id="quiz"></div>
<div class="card result" id="result"><div class="ring" id="final">0/15</div><h2 id="title">Finished!</h2><p id="text"></p><div class="review" id="review"></div><button class="restart" onclick="restart()">Try Again</button></div>
</div>
<script>
const qs=[
["anonymity","Because users can hide their real identity, the anonymity of social media can embolden people to post cruel comments. What does anonymity mean?",["the condition of having one’s identity concealed","the ability to gain many followers","the habit of posting frequently","the process of verifying an account"],0],
["embolden","Because users can hide their real identity, the anonymity of social media often emboldens people to post cruel comments. What does embolden mean?",["make someone less confident","make someone more willing to take a bold action","force someone to apologise","prevent someone from expressing an opinion"],1],
["cruel","In the phrase “cruel comments”, what does cruel mean?",["intended to cause pain or distress","carefully written and polite","humorous but harmless","based on detailed evidence"],0],
["moderation","Platforms have introduced AI moderation tools to detect and remove harmful content. What does moderation mean in this context?",["the process of monitoring and managing online content","the act of creating a social media account","the process of increasing a post’s popularity","the practice of ignoring offensive material"],0],
["detect","AI moderation tools are designed to detect hate speech before it spreads. What does detect mean?",["hide something from the public","notice or identify something","rewrite something in a friendlier way","make something more popular"],1],
["hate speech","What is hate speech?",["speech that expresses hatred or encourages hostility towards a protected group","a disagreement between two friends","a humorous comment about a celebrity","a criticism of a company’s customer service"],0],
["desensitised","After months of exposure to violent videos, many young users have become desensitised to online cruelty. What does desensitised mean?",["more sensitive to something than before","less affected or emotionally responsive to something than before","unable to access something online","more likely to report harmful content"],1],
["exposure","After months of exposure to violent videos, some users may become less affected by online cruelty. What does exposure mean?",["the experience of being subjected to or coming into contact with something","the complete removal of something","a formal complaint against someone","the protection of someone from harm"],0],
["pile on","Within minutes of the post appearing, hundreds of strangers began to pile on the person who had made the mistake. What does pile on mean?",["join others in attacking or criticising someone","leave an online discussion immediately","defend someone against criticism","share a post with no comment"],0],
["harassment","Repeated unwanted messages and insults directed at one user may constitute online harassment. What does harassment mean?",["repeated behaviour that annoys, threatens or distresses someone","a friendly exchange of opinions","a short discussion between classmates","a technical problem with an application"],0],
["hostile","A hostile online environment can make users afraid to express their opinions. What does hostile mean?",["friendly and welcoming","unfriendly or aggressive","quiet and peaceful","formal and academic"],1],
["provocative","Some users deliberately post provocative comments to trigger angry reactions. What does provocative mean?",["intended to cause a strong reaction","intended to end an argument peacefully","difficult for others to understand","written without any emotion"],0],
["amplify","Algorithms can amplify harmful content by showing it to a wider audience. What does amplify mean?",["reduce the effect or reach of something","increase or make something more widespread","remove something permanently","translate something into another language"],1],
["viral","A harmful post can quickly go viral and reach thousands of people. What does viral mean in this context?",["spread rapidly and widely online","remain visible only to its creator","contain a computer virus","receive no public attention"],0],
["counteract","Platforms use moderation tools to counteract the spread of harmful content. What does counteract mean?",["make a harmful effect stronger","act against something in order to reduce or prevent its effect","copy something exactly","ignore a problem until it disappears"],1]
];
let i=0,score=0,answered=false;
function render(){
 answered=false;let x=qs[i];
 document.getElementById("counter").textContent=`Question ${i+1} of 15`;
 document.getElementById("score").textContent=`Score: ${score}`;
 document.getElementById("bar").style.width=(i/15*100)+"%";
 document.getElementById("quiz").innerHTML=`<div class="tag">Vocabulary: ${x[0]}</div><p class="q">${x[1]}</p><div class="options">${x[2].map((v,k)=>`<button class="option" onclick="choose(${k})">${String.fromCharCode(65+k)}. ${v}</button>`).join("")}</div><div id="fb" class="feedback"></div><button id="next" class="next" onclick="nextQ()">${i===14?"See results →":"Next question →"}</button>`;
}
function choose(n){
 if(answered)return;answered=true;let x=qs[i],bs=document.querySelectorAll(".option");
 bs.forEach((b,k)=>{b.disabled=true;if(k===x[4])b.classList.add("correct");if(k===n&&n!==x[4])b.classList.add("wrong")});
 let fb=document.getElementById("fb");
 if(n===x[4]){score++;fb.className="feedback show good";fb.innerHTML="<strong>✓ Correct!</strong>"}else{fb.className="feedback show bad";fb.innerHTML=`<strong>✗ Not quite.</strong> The correct answer is <strong>${String.fromCharCode(65+x[4])}. ${x[2][x[4]]}</strong>.`}
 document.getElementById("score").textContent=`Score: ${score}`;
 document.getElementById("bar").style.width=((i+1)/15*100)+"%";
 document.getElementById("next").className="next show";
}
function nextQ(){if(!answered)return;if(i<14){i++;render()}else{document.getElementById("quiz").style.display="none";document.querySelector(".progress").style.display="none";document.getElementById("result").style.display="block";document.getElementById("final").textContent=`${score}/15`;document.getElementById("title").textContent=score>=13?"Excellent!":score>=10?"Very good!":"Keep practising!";document.getElementById("text").textContent=`You scored ${score} out of 15.`;document.getElementById("review").innerHTML="<h3>Answer Key</h3>"+qs.map((x,n)=>`<div><strong>${n+1}. ${x[0]}</strong> — ${String.fromCharCode(65+x[4])}. ${x[2][x[4]]}</div>`).join("")}}
function restart(){i=0;score=0;document.getElementById("result").style.display="none";document.getElementById("quiz").style.display="block";document.querySelector(".progress").style.display="block";render()}
render();
</script>
</body>
</html>
